<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>smoker.entry.web — Admin</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100"><header class="border-b border-slate-800 p-4"><div class="max-w-6xl mx-auto font-bold">smoker.entry.web <span class="text-slate-400 font-normal">/ Admin</span></div></header><main class="max-w-6xl mx-auto p-4 py-8"><section id="login" class="max-w-md mx-auto bg-slate-900 border border-slate-700 rounded-2xl p-6"><h1 class="text-2xl font-bold">Admin login</h1><input id="token" type="password" placeholder="Admin API token" class="w-full bg-slate-800 rounded-xl p-3 mt-4"><button onclick="login()" class="w-full bg-indigo-600 rounded-xl p-3 mt-3 font-bold">Connect</button><p id="err" class="text-rose-300 text-sm mt-3"></p></section><section id="app" class="hidden"><div class="flex justify-between items-center"><div><p class="text-indigo-300 text-xs tracking-widest">OWNER WORKSPACE</p><h1 class="text-3xl font-extrabold">Payment review</h1></div><button onclick="logout()" class="border border-slate-600 rounded-lg px-4 py-2">Log out</button></div><div id="stats" class="grid sm:grid-cols-3 gap-3 my-6"></div><div class="grid lg:grid-cols-2 gap-5"><section class="bg-slate-900 border border-slate-700 rounded-2xl p-5"><h2 class="font-bold text-xl">Configure payment wallets</h2><form id="walletForm" class="space-y-3 mt-4" onsubmit="addWallet(event)"><select id="network" class="w-full bg-slate-800 rounded-lg p-3"><option>TRC20</option><option>BEP20</option><option>ERC20</option><option>POLYGON</option><option>ARBITRUM</option></select><input id="address" required placeholder="Wallet address for selected network" class="w-full bg-slate-800 rounded-lg p-3"><button class="bg-indigo-600 rounded-lg p-3 w-full font-bold">Save wallet</button></form><div id="wallets" class="mt-4 text-sm space-y-2"></div></section><section class="bg-slate-900 border border-slate-700 rounded-2xl p-5"><h2 class="font-bold text-xl">Add ebook product</h2><form id="productForm" class="space-y-3 mt-4" onsubmit="addProduct(event)"><input name="title" required placeholder="Title" class="w-full bg-slate-800 rounded-lg p-3"><input name="category" required placeholder="Category" class="w-full bg-slate-800 rounded-lg p-3"><textarea name="description" placeholder="Description" class="w-full bg-slate-800 rounded-lg p-3"></textarea><input name="priceUSDT" type="number" min="0.01" step="0.000001" required placeholder="Price USDT" class="w-full bg-slate-800 rounded-lg p-3"><input name="imageUrl" type="url" placeholder="Cover image URL (optional)" class="w-full bg-slate-800 rounded-lg p-3"><input name="ebook" type="file" accept="application/pdf,.pdf" required class="w-full"><button class="bg-indigo-600 rounded-lg p-3 w-full font-bold">Upload PDF</button></form><p id="productMsg" class="text-sm mt-2"></p></section></div><section class="mt-6 bg-slate-900 border border-slate-700 rounded-2xl p-5"><div class="flex justify-between"><h2 class="font-bold text-xl">Orders</h2><button onclick="load()" class="text-indigo-300">Refresh</button></div><div id="orders" class="mt-4 space-y-4"></div></section></section></main><script>
const API='https://YOUR-BACKEND-DOMAIN'; // Replace with your deployed backend URL (no trailing slash).
let token='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){let r=await fetch(API+url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d;}async function login(){token=$('token').value.trim();try{await api('/api/admin/summary');sessionStorage.setItem('smoker_admin_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');load();}catch(e){$('err').textContent=e.message;}}function logout(){sessionStorage.removeItem('smoker_admin_token');location.reload();}async function load(){try{let [s,o,w]=await Promise.all([api('/api/admin/summary'),api('/api/admin/orders'),api('/api/admin/payment-wallets')]);$('stats').innerHTML=[['Needs review',s.needs_review],['Approved',s.approved],['Active products',s.active_products]].map(x=>`<div class="bg-slate-900 border border-slate-700 rounded-xl p-4"><p class="text-slate-400 text-sm">${x[0]}</p><b class="text-2xl">${x[1]}</b></div>`).join('');$('wallets').innerHTML=w.map(x=>`<div class="border-t border-slate-700 pt-2"><b>${x.network}</b> · ${esc(x.address)} <button onclick="toggleWallet(${x.id},${!x.active})" class="text-indigo-300 ml-2">${x.active?'Disable':'Enable'}</button></div>`).join('')||'No wallet configured.';$('orders').innerHTML=o.map(x=>`<article class="border border-slate-700 rounded-xl p-4"><div class="flex flex-wrap justify-between gap-2"><div><b>${esc(x.title)}</b><p class="text-sm text-slate-400">${esc(x.customer_email)} · ${x.expected_amount} USDT · ${x.network||'—'}</p><p class="text-xs mt-1">Order ${x.id}</p></div><span class="text-sm rounded-full px-3 py-1 bg-slate-800">${x.status}</span></div><p class="font-mono text-xs break-all mt-3">TXID: ${esc(x.submitted_txid||'Not submitted')}</p>${x.payment_proof?`<a class="text-indigo-300 underline text-sm" target="_blank" href="/api/admin/payment-proofs/${encodeURIComponent(x.payment_proof)}" onclick="return openProof(event,this)">View payment screenshot</a>`:''}${x.review_note?`<p class="text-rose-300 text-sm mt-2">Note: ${esc(x.review_note)}</p>`:''}${x.status==='submitted'?`<div class="flex gap-2 mt-4"><button onclick="approve('${x.id}')" class="bg-emerald-700 rounded-lg px-4 py-2">Approve & release ebook</button><button onclick="reject('${x.id}')" class="bg-rose-800 rounded-lg px-4 py-2">Reject</button></div>`:''}<div class="mt-4 border-t border-slate-700 pt-3"><div id="msgs-${x.id}" class="text-sm space-y-2 mb-2"></div><form onsubmit="sendMessage(event,'${x.id}')" class="flex gap-2"><input name="message" required maxlength="2000" placeholder="Reply to customer" class="min-w-0 flex-1 bg-slate-800 rounded-lg p-2"><button class="bg-indigo-700 rounded-lg px-3">Send</button></form></div></article>`).join('')||'No orders yet.';for(const x of o)loadMessages(x.id);}catch(e){alert(e.message);}}function openProof(e,a){e.preventDefault();const u=API+a.getAttribute('href');fetch(u,{headers:{Authorization:'Bearer '+token}}).then(r=>r.blob()).then(b=>{let url=URL.createObjectURL(b);window.open(url,'_blank');});return false;}async function loadMessages(id){try{let m=await api('/api/admin/orders/'+id+'/messages');let el=$('msgs-'+id);if(el)el.innerHTML=m.map(x=>`<p><b>${x.sender}:</b> ${esc(x.message)}</p>`).join('');}catch{}}async function sendMessage(e,id){e.preventDefault();let f=new FormData(e.target);await api('/api/admin/orders/'+id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:f.get('message')})});e.target.reset();loadMessages(id);}async function approve(id){if(!confirm('Approve payment and release ebook download access?'))return;try{await api('/api/admin/orders/'+id+'/approve',{method:'POST'});load();}catch(e){alert(e.message);}}async function reject(id){let note=prompt('Reason for rejection (customer will see this):');if(!note)return;try{await api('/api/admin/orders/'+id+'/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note})});load();}catch(e){alert(e.message);}}async function addWallet(e){e.preventDefault();try{await api('/api/admin/payment-wallets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({network:$('network').value,address:$('address').value.trim()})});$('address').value='';load();}catch(e){alert(e.message);}}async function toggleWallet(id,active){await api('/api/admin/payment-wallets/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})});load();}async function addProduct(e){e.preventDefault();try{await api('/api/admin/products',{method:'POST',body:new FormData(e.target)});$('productMsg').textContent='Product uploaded.';e.target.reset();load();}catch(e){$('productMsg').textContent=e.message;}}token=sessionStorage.getItem('smoker_admin_token')||'';if(token){$('token').value=token;login();}
</script></body></html>
